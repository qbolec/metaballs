// New potential function has deg=4, which makes it possible to solve   
// (1 - (x/r)^2)^2  =   1 + (x^2/r^2)^2 - 2(x^2/r^2)
// Let t be distance along ray
// Let d[i] be distance of i-th ball center from ray
// Let s[i] be shadow on i-th ball on the ray 
// Then x^2 = (t - s[i])^2 + d[i]^2 
// (1 - ((t - s[i])^2 + d[i]^2)/r^2)^2 
// Let T = t/r , S[i]=s[i]/r and D[i]=d[i]/r
// (1 - ((T - S[i])^2 + D[i]^2))^2 

int signChanges(float o, float v[25]){
  int s=0;
  float lastSign=0.0;
  for(int r=0;r<5;++r){
    float w=0.0;
    for(int i=5;i-->0;){
      w*=o;
      w+=v[r*5+i];
    }
    if(r>0){
      float curSign = sign(w);
      if(curSign!=0.0){
        if(curSign!=lastSign){
          s++;
          lastSign=curSign;
        }
      }
    }else{
      lastSign=w>0.0?1.0:-1.0;
    }
  }
  return s;
}

vec3 computeNormal(vec3 pos) {
  float r2 = uR * uR;
  vec3 g = vec3(0.0);
  for (int i = 0; i < NUM_BALLS; i++) {
    vec3 diff = pos - uBalls[i];
    float d2 = dot(diff, diff);
    //  (f(x)**2)' = 2*f(x) * f(x)' = 2*(1-d2/r2) * -2*diff/r2
    // Since we are going to normalize anyway, the constant factor -4.0/r2 is not important
    float u = 1.0 - d2 / r2;
    if (u > 0.0) g -= u * diff;
  }
  return normalize(-g);
}

void main() {
  float r2 = uR * uR;
  float invR2 = 1.0/r2;
  float invR = 1.0/uR;

  // (1.0 - (d[i]**2 + s[i]**2)/r2  +  2*s[i]/r2*t   -  1/r2*t*t)
  // ----a0-----------------------     --a1-----        --a2-

    float s = dot(oc, rd);

    float d2 = ococ - s*s;
    float disc = r2 - d2;
    if (disc > 0.0) {
      float sq = sqrt(disc);
      tStarts[i] = s - sq;
      tEnds[i]   = s + sq;

      a0s[i] = 1.0 - ococ * invR2;
      a1s[i] = 2.0*s*invR2;

      float e2=0.0;

            // ---c0----   ----c1------   --c2-------   --c0--  ---c1---  c0

        continue;
      }

      if(sc0<scMax){
        fragColor=COLOR_BLUE;
        return;
      }
      
      float t_s = t0;
      float t_e = maxT;
      for (int step = 0; step < 8; ++step) {
        if(t_e - t_s < 0.005)break;
        float t = (t_s + t_e)*0.5;
        // The idea here is that we want o to be in [0,1] so that the computation of 4-th power is numerically stable
        float o = (t-t0)*0.5*invR;
        int sco = signChanges(o,v);
        if(sco<sc0){
          t_e = t;
        } else {
          t_s = t;
        }
      }
      bestT = t_e;
    }
  }

  if (bestT >= BIG) { discard; }
  vec3 hitPos = ro + bestT * rd;
  vec3 normal = computeNormal(hitPos);

  float diff = max(dot(normal, uLightDir), 0.0);
  float amb  = 0.08;
  vec3 viewDir = -rd;
  float rim = pow(1.0 - max(dot(normal, viewDir), 0.0), 3.0);
  vec3 halfV = normalize(uLightDir + viewDir);
  float spec = pow(max(dot(normal, halfV), 0.0), 64.0);

  vec3 refl = reflect(rd, normal);
  float envU = 0.5 + atan(refl.z, refl.x) / (2.0 * 3.14159265);
  float envV = 0.5 - asin(clamp(refl.y, -1.0, 1.0)) / 3.14159265;
  vec3 envColor = texture(uEnvMap, vec2(envU, envV)).rgb;

  vec3 baseColor = vec3(1.0, 1.0, 1.0);
  float fresnel = pow(1.0 - max(dot(normal, viewDir), 0.0), 2.0);
  vec3 col = baseColor * (amb + diff * 0.5)
           + envColor  * (0.2 + fresnel)
           + vec3(1.0) * spec * 0.4
           + vec3(0.3, 0.5, 1.0) * rim * 0.5
           ;

  col = mix(vec3(0.0), col, exp(-bestT * 0.04));
  col = pow(clamp(col, 0.0, 1.0), vec3(1.0/2.2));
  fragColor = vec4(col, 1.0);
}`;

// ── Compile ───────────────────────────────────────────────────────────────────
function compile(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS))
    fail('Shader error:\n' + gl.getShaderInfoLog(sh));
  return sh;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER,   vsSource));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSource));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
  fail('Link error:\n' + gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const loc = {
  aPos:      gl.getAttribLocation(prog,  'aPos'),
  uMVP:      gl.getUniformLocation(prog, 'uMVP'),
  uBalls:    Array.from({length:9}, (_,i) => gl.getUniformLocation(prog, `uBalls[${i}]`)),
  uR:        gl.getUniformLocation(prog, 'uR'),
  uCamPos:   gl.getUniformLocation(prog, 'uCamPos'),
  uLightDir: gl.getUniformLocation(prog, 'uLightDir'),
  uEnvMap:   gl.getUniformLocation(prog, 'uEnvMap'),
};

// ── Box geometry ──────────────────────────────────────────────────────────────
function makeBox(cx, cy, cz, hs) {
  const x0=cx-hs,x1=cx+hs,y0=cy-hs,y1=cy+hs,z0=cz-hs,z1=cz+hs;
  return [
    x0,y0,z0, x1,y0,z0, x1,y1,z0,  x0,y0,z0, x1,y1,z0, x0,y1,z0,
    x0,y0,z1, x1,y1,z1, x1,y0,z1,  x0,y0,z1, x0,y1,z1, x1,y1,z1,
    x0,y0,z0, x0,y1,z1, x0,y0,z1,  x0,y0,z0, x0,y1,z0, x0,y1,z1,
    x1,y0,z0, x1,y0,z1, x1,y1,z1,  x1,y0,z0, x1,y1,z1, x1,y1,z0,
    x0,y0,z0, x0,y0,z1, x1,y0,z1,  x0,y0,z0, x1,y0,z1, x1,y0,z0,
    x0,y1,z0, x1,y1,z1, x0,y1,z1,  x0,y1,z0, x1,y1,z0, x1,y1,z1,
  ];
}

// ── Ball layout ───────────────────────────────────────────────────────────────
// Ball 0: center. Balls 1-8: corners of a cube.
const R = 0.45;
const CORNER_DIST = 0.31;
const D = CORNER_DIST;
const HOME = [
  [0, 0, 0],          // 0: center (stationary)
  [-D, -D, -D],       // 1
  [ D, -D, -D],       // 2
  [-D,  D, -D],       // 3
  [ D,  D, -D],       // 4
  [-D, -D,  D],       // 5
  [ D, -D,  D],       // 6
  [-D,  D,  D],       // 7
  [ D,  D,  D],       // 8
];

// Current and target positions (flat arrays for smooth lerp)
const curPos  = HOME.map(p => [...p]);
const wantPos = HOME.map(p => [...p]);

// ── Note scheduling ───────────────────────────────────────────────────────────
// ball index for each note event: notes map to balls 1-8
// (ball 0 is center, always stationary)
const LEAD_MS  = 100;  // start moving 100ms before note
const STAY_MS  = 100;  // stay at center 100ms after note
let startTime  = null; // performance.now() when music started

function updateWantedPositions() {
  if (startTime === null) return;
  const nowMs = bgm.currentTime*1000;

  // Reset all corner balls to home
  for (let i = 1; i <= 8; i++) wantPos[i] = [...HOME[i]];

  // For each note, if we're within [t - LEAD_MS, t + STAY_MS], pull ball to center
  for (const note of NOTES) {
    const noteMs = note.t * 1000;
    const ballIdx = note.ball + 1; // notes map to balls 1-8
    if (nowMs >= noteMs - LEAD_MS && nowMs <= noteMs + STAY_MS) {
      wantPos[ballIdx] = [0, 0, 0];
    }
  }
}

// ── VAO / VBO ─────────────────────────────────────────────────────────────────
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.enableVertexAttribArray(loc.aPos);
gl.vertexAttribPointer(loc.aPos, 3, gl.FLOAT, false, 0, 0);
gl.bindVertexArray(null);

// ── Math ──────────────────────────────────────────────────────────────────────
function norm(v)    { const l=Math.hypot(...v); return v.map(x=>x/l); }
function sub(a,b)   { return a.map((x,i)=>x-b[i]); }
function dot(a,b)   { return a.reduce((s,x,i)=>s+x*b[i],0); }
function cross(a,b) { return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]; }

function mat4mul(a, b) {
  const o = new Float32Array(16);
  for (let c=0;c<4;c++) for (let r=0;r<4;r++) for (let k=0;k<4;k++)
    o[c*4+r] += a[k*4+r] * b[c*4+k];
  return o;
}
function perspective(fovy, aspect, near, far) {
  const f=1/Math.tan(fovy/2), nf=1/(near-far);
  return new Float32Array([f/aspect,0,0,0, 0,f,0,0, 0,0,(far+near)*nf,-1, 0,0,2*far*near*nf,0]);
}
function lookAt(eye, center, up) {
  const z=norm(sub(eye,center)), x=norm(cross(up,z)), y=cross(z,x);
  return new Float32Array([x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0,
    -dot(x,eye),-dot(y,eye),-dot(z,eye),1]);
}

// ── Camera ────────────────────────────────────────────────────────────────────
let camTheta=1.41, camPhi=0.25, camDist=3;
// let camTheta=1.41, camPhi=0.25, camDist=2;
let dragging=false, lastX=0, lastY=0, lastTouches=null;

canvas.addEventListener('mousedown', e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; });
window.addEventListener('mouseup',   ()=>dragging=false);
window.addEventListener('mousemove', e=>{
  if (!dragging) return;
  camTheta -= (e.clientX-lastX)*0.008;
  camPhi = Math.max(-1.4,Math.min(1.4,camPhi-(e.clientY-lastY)*0.008));
  lastX=e.clientX; lastY=e.clientY;
});
canvas.addEventListener('wheel', e=>{
  camDist=Math.max(2,Math.min(10,camDist+e.deltaY*0.005));
  e.preventDefault();
},{passive:false});

function touchDist(t) { return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY); }

canvas.addEventListener('touchstart', e=>{ e.preventDefault(); lastTouches=e.touches; },{passive:false});
canvas.addEventListener('touchend',   e=>{ e.preventDefault(); lastTouches=e.touches.length?e.touches:null; },{passive:false});
canvas.addEventListener('touchmove',  e=>{
  e.preventDefault();
  const t=e.touches;
  if (!lastTouches) { lastTouches=t; return; }
  if (t.length===1 && lastTouches.length===1) {
    camTheta -= (t[0].clientX-lastTouches[0].clientX)*0.008;
    camPhi=Math.max(-1.4,Math.min(1.4,camPhi-(t[0].clientY-lastTouches[0].clientY)*0.008));
  } else if (t.length===2 && lastTouches.length===2) {
    const prev=touchDist(lastTouches), curr=touchDist(t);
    camDist=Math.max(2,Math.min(10,camDist-(curr-prev)*0.02));
  }
  lastTouches=t;
},{passive:false});

// ── Start on tap ──────────────────────────────────────────────────────────────
function start() {
  overlay.classList.add('hidden');
  bgm.volume=0.6;
  bgm.play().finally(()=>{startTime = performance.now();});
  
}
overlay.addEventListener('click',     start, {once:true});
overlay.addEventListener('touchend',  start, {once:true});

// ── Resize ────────────────────────────────────────────────────────────────────
function resize() {
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  gl.viewport(0,0,canvas.width,canvas.height);
}
window.addEventListener('resize', resize);
resize();

// ── Render loop ───────────────────────────────────────────────────────────────
let lastFrameTime = null;

let avg_dt=0;

function render(time) {
  const dt = lastFrameTime === null ? 0 : Math.min((time - lastFrameTime) * 0.001, 0.05);
  lastFrameTime = time;
  avg_dt=avg_dt*0.9+dt*0.1;
  fps.innerText = `${Math.round(avg_dt * 1000)}ms`;

  // Update wanted positions based on music time
  updateWantedPositions();

  // Smooth lerp current → wanted
  const LERP = 1.0 - Math.pow(0.001, dt); // ~exponential approach, ~10ms time constant
  for (let i = 0; i < 9; i++) {
    for (let j = 0; j < 3; j++) {
      curPos[i][j] += (wantPos[i][j] - curPos[i][j]) * LERP;
    }
  }

  // Build bounding boxes for all balls
  const verts = [];
  const hs = R + 0.02;
  // One large scene box + per-ball boxes
  verts.push(...makeBox(0, 0, 0, D + hs));
  for (let i = 0; i < 9; i++) {
    verts.push(...makeBox(curPos[i][0], curPos[i][1], curPos[i][2], hs));
  }

  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.DYNAMIC_DRAW);

  const camX=camDist*Math.cos(camPhi)*Math.sin(camTheta);
  const camY=camDist*Math.sin(camPhi);
  const camZ=camDist*Math.cos(camPhi)*Math.cos(camTheta);
  const eye=[camX,camY,camZ];

  const proj=perspective(Math.PI/4, canvas.width/canvas.height, 0.1, 50.0);
  const view=lookAt(eye,[0,0,0],[0,1,0]);
  const mvp=mat4mul(proj,view);
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.FRONT);
  gl.uniformMatrix4fv(loc.uMVP,false,mvp);
  gl.uniform1f(loc.uR, R);
  gl.uniform3fv(loc.uCamPos,   new Float32Array(eye));
  gl.uniform3fv(loc.uLightDir, new Float32Array(norm([0.389,0.748,0.535])));
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, envTex);
  gl.uniform1i(loc.uEnvMap, 0);
  for (let i=0;i<9;i++)
    gl.uniform3fv(loc.uBalls[i], new Float32Array(curPos[i]));

  gl.clearColor(0,0,0,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES, 0, verts.length/3);
  gl.bindVertexArray(null);
  requestAnimationFrame(render);
}
requestAnimationFrame(render);


</script>
